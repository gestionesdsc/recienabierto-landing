<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cargando negocio...</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 40px 20px;
      color: #334155;
    }
    .spinner {
      margin: 20px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #18B7C6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a {
      color: #18B7C6;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Abriendo en Recién Abierto...</p>
  <p style="font-size: 14px; margin-top: 20px;">
    Si no tienes la app, <a id="download-link" href="/descargar">descárgala gratis aquí</a>.
  </p>
  <script src="/promotion-referrals.js"></script>
  <script>
    // Process referral visits (if ref is valid) and obtain the target deep linking URL
    const fallbackScheme =
      "recienabierto://" +
      (window.location.pathname + window.location.search).replace(/^\//, "");

    let appNavigationAttempted = false;

    function navigateToAppOnce(url) {
      if (appNavigationAttempted) return;
      appNavigationAttempted = true;
      window.location.replace(url || fallbackScheme);
    }

    try {
      if (
        window.PromotionReferrals &&
        window.PromotionReferrals.processAndRedirect
      ) {
        Promise.resolve(
          window.PromotionReferrals.processAndRedirect(window.location)
        ).then(
          function (res) {
            navigateToAppOnce((res && res.schemeUrl) || fallbackScheme);
          },
          function () {
            navigateToAppOnce(fallbackScheme);
          }
        );
      } else {
        navigateToAppOnce(fallbackScheme);
      }
    } catch (e) {
      navigateToAppOnce(fallbackScheme);
    }

    // Platform-specific fallback detection
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/i.test(userAgent) && !window.MSStream;
    const isAndroid = /Android/i.test(userAgent);

    // Determine target URL in case the app is not installed (3-second timeout fallback)
    let fallbackUrl = "/descargar"; // Default fallback for desktop/others
    if (isIOS) {
      fallbackUrl = "https://apps.apple.com/es/app/recien-abierto/id6766087032";
    } else if (isAndroid) {
      fallbackUrl = "https://play.google.com/store/apps/details?id=com.recienabierto.recienabierto";
    }

    // Update the manual download link's href to point directly to the correct platform link
    document.getElementById("download-link").href = fallbackUrl;

    // Redirect to the appropriate fallback after 3 seconds
    setTimeout(function () {
      window.location.replace(fallbackUrl);
    }, 3000);
  </script>
</body>
</html>
