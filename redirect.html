<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cargando negocio...</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 40px 20px;
      color: #334155;
    }
    .spinner {
      margin: 20px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #18B7C6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a {
      color: #18B7C6;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Abriendo en Recién Abierto...</p>
  <p style="font-size: 14px; margin-top: 20px;">
    Si no tienes la app, <a id="download-link" href="/descargar">descárgala gratis aquí</a>.
  </p>
  <script src="/promotion-referrals.js"></script>
  <script>
    // Process referral visits (if ref is valid) and obtain the target deep linking URL
    const fallbackScheme =
      "recienabierto://" +
      (window.location.pathname + window.location.search).replace(/^\//, "");

    let appNavigationAttempted = false;
    let hasLeftPage = false;
    let fallbackTimer = null;

    function cancelFallback() {
      hasLeftPage = true;
      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }
    }

    // Detect if app opened and browser went into background
    window.addEventListener("pagehide", cancelFallback);
    window.addEventListener("blur", cancelFallback);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) cancelFallback();
    });

    function navigateToAppOnce(url) {
      if (appNavigationAttempted) return;
      appNavigationAttempted = true;
      window.location.replace(url || fallbackScheme);
    }

    try {
      if (
        window.PromotionReferrals &&
        window.PromotionReferrals.processAndRedirect
      ) {
        Promise.resolve(
          window.PromotionReferrals.processAndRedirect(window.location)
        ).then(
          function (res) {
            navigateToAppOnce((res && res.schemeUrl) || fallbackScheme);
          },
          function () {
            navigateToAppOnce(fallbackScheme);
          }
        );
      } else {
        navigateToAppOnce(fallbackScheme);
      }
    } catch (e) {
      navigateToAppOnce(fallbackScheme);
    }

    // Platform-specific fallback detection
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/i.test(userAgent) && !window.MSStream;
    const isAndroid = /Android/i.test(userAgent);

    // Update the manual download link's href
    const downloadLink = document.getElementById("download-link");
    if (isAndroid) {
      downloadLink.href = "market://details?id=com.recienabierto.recienabierto";
    } else if (isIOS) {
      downloadLink.href = "https://apps.apple.com/es/app/recien-abierto/id6766087032";
    } else {
      downloadLink.href = "/descargar";
    }

    // Execute fallback to store if app is not installed (after 1800ms)
    fallbackTimer = setTimeout(function () {
      if (hasLeftPage || document.hidden) return;

      if (isAndroid) {
        // Intento 1 (principal): abrir directamente la app nativa Google Play Store
        window.location.href = "market://details?id=com.recienabierto.recienabierto";
        // Intento 2 (fallback secundario): URL web de Google Play solo si market:// no responde
        setTimeout(function () {
          if (!hasLeftPage && !document.hidden) {
            window.location.replace("https://play.google.com/store/apps/details?id=com.recienabierto.recienabierto");
          }
        }, 1000);
      } else if (isIOS) {
        // Intento 1 (principal): esquema directo hacia App Store
        window.location.href = "itms-apps://apps.apple.com/app/id6766087032";
        // Intento 2 (fallback secundario): URL HTTPS oficial de App Store
        setTimeout(function () {
          if (!hasLeftPage && !document.hidden) {
            window.location.replace("https://apps.apple.com/es/app/recien-abierto/id6766087032");
          }
        }, 1000);
      } else {
        // Desktop / otros dispositivos
        window.location.replace("/descargar");
      }
    }, 1800);
  </script>
</body>
</html>
